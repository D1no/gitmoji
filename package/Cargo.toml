[package]
name = "gitmoji-triangle"
version = "0.15.1"
edition = "2024"
publish = false
description = "Checks and explains Gitmoji Triangle commit messages"
license = "MIT"

[[bin]]
name = "gitmoji"
path = "src/main.rs"

[lib]
name = "gitmoji_triangle"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = "0.8"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Each release distributes one binary per platform. Keep the download small.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
