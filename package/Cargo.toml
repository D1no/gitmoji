[package]
name = "gitmoji-triangle"
version = "0.21.0"
edition = "2024"
publish = false
description = "Checks and explains Gitmoji Triangle commit messages"
license = "MIT"

[[bin]]
name = "gitmoji"
path = "src/main.rs"

[lib]
name = "gitmoji_triangle"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
encoding_rs = "0.8"
percent-encoding = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
shlex = "1.3"
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["rustls", "json", "platform-verifier"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = "0.8"
serde_yaml_ng = "0.10"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Each release distributes one binary per platform. Keep the download small.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
