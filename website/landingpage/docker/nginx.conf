# Serves the built page as files. Nothing is proxied and nothing is rewritten.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The gateway in front owns the public address; a redirect must not name this port.
    absolute_redirect off;

    # A missing file is a real 404, never the page itself.
    location / {
        try_files $uri $uri/ =404;
    }

    # The page changes with every build; its assets carry a hash in their names.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
